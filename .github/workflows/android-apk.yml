name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_godot/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android build dependencies
        run: |
          # Install a clean, isolated Android SDK with only the components Godot needs,
          # instead of the preinstalled SDK that contains many build-tools versions.
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_DIR"
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Install Godot 4.3 and Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/Godot_v4.3-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Godot Android toolchain
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Diagnose Android export setup
        run: |
          echo "SDK_DIR=$SDK_DIR JAVA_HOME=$JAVA_HOME"
          ls "$SDK_DIR" || true
          ls "$SDK_DIR/build-tools" "$SDK_DIR/platforms" "$SDK_DIR/platform-tools" || true
          "$JAVA_HOME/bin/java" -version 2>&1 || true
          echo "--- export templates:"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable" | head -40 || true
          echo "--- keystore:"
          ls -la "$HOME/.android" || true
          echo "--- editor settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres" || true
          echo "--- godot version:"
          godot --version || true

      - name: Validate Godot project
        working-directory: mobile_godot
        run: godot --headless --editor --quit

      - name: Export Android debug APK
        working-directory: mobile_godot
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/deti_eltan_mobile_debug.apk 2>&1 | tee build/export.log

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-export-log
          path: mobile_godot/build/export.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deti-eltan-mobile-debug
          path: mobile_godot/build/deti_eltan_mobile_debug.apk
          if-no-files-found: error
